services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: phoenix_list
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在项目根目录 .env 里设置 POSTGRES_PASSWORD}
      POSTGRES_DB: phoenix_list_production
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phoenix_list -d phoenix_list_production"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:?请在项目根目录 .env 里设置 RAILS_MASTER_KEY}
      DATABASE_URL: postgres://phoenix_list:${POSTGRES_PASSWORD}@db:5432/phoenix_list_production
      APP_HOST: ${APP_HOST:?请在项目根目录 .env 里设置 APP_HOST}
      WECHAT_APPID: ${WECHAT_APPID:-}
      WECHAT_SECRET: ${WECHAT_SECRET:-}
      RAILS_LOG_LEVEL: info
    volumes:
      - storage_data:/rails/storage
    ports:
      - "127.0.0.1:3000:3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"

volumes:
  db_data:
  storage_data:
